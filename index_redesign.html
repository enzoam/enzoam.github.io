<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gene-Z Games — Redesign</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="css/redesign.css">
	<!-- Retro fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@300;700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-dark border-bottom">
  <div class="container-fluid">
	<a class="navbar-brand d-flex align-items-center" href="#">
		<img src="genezgameslogosega.png?raw=true" alt="logo" height="36" class="me-2">
		<span class="retro-title">Gene-Z Games</span>
	</a>

	<form class="d-flex" role="search" onsubmit="return false;">
	  <input id="searchInput" class="form-control form-control-sm me-2" type="search" placeholder="Buscar jogos..." aria-label="Search" oninput="filterCards()">
	</form>
  </div>
</nav>

<main class="container py-4">
  <header class="mb-4">
	<h1 class="h3">Catálogo de Jogos</h1>
	<p class="text-muted">Versão de mockup com tema escuro e grid responsivo (Bootstrap 5).</p>
  </header>

  <div id="cardsRow" class="row g-3">
	<!-- Cards serão carregados dinamicamente via JS -->
  </div>

  <!-- Modal de preview (Bootstrap) -->
  <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-xl modal-dialog-centered">
	  <div class="modal-content bg-dark text-light">
		<div class="modal-header">
		  <h5 id="previewTitle" class="modal-title">Preview</h5>
		  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
		</div>
		<div class="modal-body">
		  <div id="previewBody" class="text-center">
			<!-- conteúdo carregado dinamicamente -->
		  </div>
		</div>
	  </div>
	</div>
  </div>

  <script>
// when preview modal opens, hide the scanlines overlay so modal remains bright
document.addEventListener('DOMContentLoaded', ()=>{
	const previewModalEl = document.getElementById('previewModal');
	if(previewModalEl){
		previewModalEl.addEventListener('show.bs.modal', ()=>{
			document.body.classList.add('hide-scanlines');
		});
		previewModalEl.addEventListener('hidden.bs.modal', ()=>{
			document.body.classList.remove('hide-scanlines');
		});
	}
});

	const MAX_INDEX = 500; // ajuste conforme seu acervo
	const cardsRow = document.getElementById('cardsRow');

	function createCard(id){
	  const col = document.createElement('div');
	  col.className = 'col-6 col-md-4 col-lg-3';
	  col.setAttribute('data-title', 'Carregando...');

	  const card = document.createElement('div');
	  card.className = 'card bg-secondary text-light h-100 card-hover';

	  const img = document.createElement('img');
	  img.className = 'card-img-top';
	  img.src = `content/${id}/cover.png?raw=true`;
	  img.alt = 'cover';
	  img.onerror = () => { img.src = 'https://via.placeholder.com/600x360?text=Sem+Imagem'; };

	  const body = document.createElement('div');
	  body.className = 'card-body d-flex flex-column';
	  const titleEl = document.createElement('h5');
	  titleEl.className = 'card-title mb-1';
	  titleEl.textContent = `Game ${id}`;
	  const metaEl = document.createElement('p');
	  metaEl.className = 'card-text text-muted small mb-2';
	  metaEl.textContent = `ID: ${id}`;

	  const footer = document.createElement('div');
	  footer.className = 'mt-auto d-flex justify-content-between align-items-center';

	  const previewBtn = document.createElement('button');
	  previewBtn.className = 'btn btn-sm btn-outline-light';
	  previewBtn.textContent = 'Preview';
	  previewBtn.onclick = () => openPreview(id);

	  const openBtn = document.createElement('button');
	  openBtn.className = 'btn btn-sm btn-outline-light';
	  openBtn.textContent = 'Abrir';
	  openBtn.onclick = () => { if(window.function_carrega_popup_imgs) function_carrega_popup_imgs(id); else window.open(`content/${id}/`, '_blank'); };

	  footer.appendChild(previewBtn);
	  footer.appendChild(openBtn);

	  body.appendChild(titleEl);
	  body.appendChild(metaEl);
	  body.appendChild(footer);
	  card.appendChild(img);
	  card.appendChild(body);
	  col.appendChild(card);
	  cardsRow.appendChild(col);

	// tentar carregar meta.json -> usar description como nome, senão title, senão index.html title
	fetch(`content/${id}/meta.json`).then(r=>{
		if(!r.ok) throw 0;
		return r.json();
	}).then(j=>{
		const name = j.description || j.title || j.name || j.nome || j.project || null;
		if(name){ titleEl.textContent = name; col.setAttribute('data-title', name); }
	}).catch(()=>{
		// tentar index.html
		fetch(`content/${id}/index.html`).then(r=>{
		  if(!r.ok) throw 0;
		  return r.text();
		}).then(t=>{
		  const m = t.match(/<title>([^<]+)<\/title>/i);
		  if(m && m[1]){ titleEl.textContent = m[1].trim(); col.setAttribute('data-title', m[1].trim()); }
		}).catch(()=>{
		  // fallback já definido
		});
	  });
	}

	function openPreview(id){
	  const previewBody = document.getElementById('previewBody');
	  const previewTitle = document.getElementById('previewTitle');
	  previewTitle.textContent = `Game ${id}`;
	  previewBody.innerHTML = `<img src="content/${id}/cover.png?raw=true" style="max-width:100%;height:auto" onerror="this.src='https://via.placeholder.com/900x540?text=Sem+Imagem'"></img>`;
	  const modal = new bootstrap.Modal(document.getElementById('previewModal'));
	  modal.show();
	}

	function loadDynamicCards(){
	  for(let i = MAX_INDEX; i >= 0; --i){
		const file_path = `/content/${i}/cover.png`;
		fetch(file_path, {method:'HEAD'}).then(resp=>{
		  if(resp.ok) createCard(i);
		}).catch(()=>{/* sem imagem */});
	  }
	}

	document.addEventListener('DOMContentLoaded', ()=>{
	  loadDynamicCards();
	});
  </script>
</main>

<!-- Popup flutuante compatível com sua função existente -->
<div id='popup' style='position: fixed; top: 80px; left: 10%; width: 85%; height:80%; min-height:200px; background-color: #000; z-index:2100; border-radius: 12px; border-style: outset; background-image: none; display: none; overflow: hidden;'>
  <div style='float: right; padding:8px; position: absolute; right:8px; top:6px; z-index:2200;'><a href='#popup' onclick='function_close_popup();' style='color:#fff;text-decoration:none;font-weight:bold;'>✕</a></div>
  <div id='popupcontent' style='width: 100%; height: 100%; padding:12px; box-sizing:border-box; color:#fff; overflow:auto;'>
	<!-- conteúdo injetado por function_carrega_popup_imgs -->
  </div>
</div>

<!-- Popup container inserted before footer: reserved for image slideshow/popups -->
<div id="popup-container" aria-hidden="true" style="display:none;">
  <!-- conteúdo do popup será injetado por js/funcoespagina.js -->
</div>
<footer class="text-center py-4 text-muted small">
  &copy; 1997-2025 Gene-Z Games — Mockup de redesign
</footer>

  <!-- Bootstrap bundle (JS + Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Funções da página existentes (abre popup com slideshow etc.) -->
<script src="js/funcoespagina.js"></script>

<script>
function filterCards(){
	const qRaw = document.getElementById('searchInput').value.trim();
	const q = normalizeString(qRaw);
	const cards = document.querySelectorAll('#cardsRow > .col-6');
	cards.forEach(c => {
		const title = normalizeString(c.getAttribute('data-title')||'');
		if(!q || title.indexOf(q) !== -1){
			c.style.display = '';
		} else {
			c.style.display = 'none';
		}
	});
}

function normalizeString(str){
	if(!str) return '';
	// remove diacritics, punctuation and lowercase
	try{
		return str.normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/[\W_]+/g,' ').trim().toLowerCase();
	} catch(e){
		// fallback for older browsers
		return str.replace(/[\u0300-\u036f]/g,'').replace(/[^\w\s]/g,' ').trim().toLowerCase();
	}
}
</script>

<script>
// Fallback handlers to ensure modal can be closed by clicking X or backdrop
document.addEventListener('click', function(e){
	try{
		// close buttons inside modal (btn-close or data-bs-dismiss)
		if(e.target.closest && (e.target.matches('.btn-close') || e.target.closest('[data-bs-dismiss="modal"]'))){
			const modalEl = document.getElementById('previewModal');
			if(modalEl){
				const inst = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
				inst.hide();
			}
		}

		// clicking on backdrop element
		if(e.target && e.target.classList && e.target.classList.contains('modal-backdrop')){
			// hide all visible bootstrap modals
			document.querySelectorAll('.modal.show').forEach(m=>{
				const inst = bootstrap.Modal.getInstance(m) || new bootstrap.Modal(m);
				inst.hide();
			});
		}
	} catch(err){
		// swallow errors to avoid breaking page
		console.warn('Modal fallback handler error', err);
	}
});
</script>

</body>
</html>
